{% extends 'layout.html' %}

{% block title %}Login | ATM System{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <h1>Account Login</h1>
    <p>Enter your account number and PIN to continue.</p>
  </div>

  <form method="post" class="form-grid">
    <label for="account_number">Account Number</label>
    <input id="account_number" name="account_number" type="text" placeholder="12345678" required />

    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" placeholder="****" required />

    <button type="submit" class="primary-button">Login</button>
  </form>

  <div class="sample-credentials">
    <p><strong>Sample credentials</strong></p>
    <p>Account number: <code>12345678</code></p>
    <p>PIN: <code>1234</code></p>
  </div>
</div>
{% endblock %}
